        let map;
        let markersGroup;
        const markerMap = new Map();
        let currentSelectedDistrict = "ALL";
        let currentSearchQuery = "";
        let activeCardId = null;

        // Kaohsiung Center Coordinates
        const KAOHSIUNG_CENTER = [22.6380, 120.3080];
        const DEFAULT_ZOOM = 13;

        // DOM elements
        const restaurantList = document.getElementById('restaurantList');
        const districtContainer = document.getElementById('districtContainer');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const restaurantCountEl = document.getElementById('restaurantCount');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const recenterMapBtn = document.getElementById('recenterMapBtn');

        function initMap() {
            // Initialize Leaflet Map
            map = L.map('map', {
                zoomControl: false
            }).setView(KAOHSIUNG_CENTER, DEFAULT_ZOOM);

            // Add Zoom Control at Top Right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // OpenStreetMap Tile Layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
        }

        function createCustomIcon(isActive = false) {
            const color = isActive ? '#A61C1C' : '#2D5A27';
            const size = isActive ? 38 : 30;
            
            const svgHtml = `
                <svg width="${size}" height="${size}" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 0C11.268 0 5 6.268 5 14C5 24.5 19 38 19 38C19 38 33 24.5 33 14C33 6.268 26.732 0 19 0Z" fill="${color}"/>
                    <circle cx="19" cy="14" r="8" fill="white"/>
                    <text x="19" y="18" font-size="10" font-weight="bold" fill="${color}" text-anchor="middle">🍝</text>
                </svg>
            `;

            return L.divIcon({
                html: svgHtml,
                className: `custom-pin ${isActive ? 'active-pin' : ''}`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size],
                popupAnchor: [0, -size]
            });
        }

        function renderDistrictFilters() {
            // Extract unique districts
            const districts = ["ALL", ...new Set(restaurants.map(r => r.district))];

            districtContainer.innerHTML = '';
            districts.forEach(dist => {
                const btn = document.createElement('button');
                const isSelected = dist === currentSelectedDistrict;
                btn.className = `px-2.5 py-1 text-xs rounded-lg font-medium transition duration-150 ${
                    isSelected 
                        ? 'bg-italy-red text-white shadow-sm ring-2 ring-italy-red ring-offset-1' 
                        : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'
                }`;
                btn.textContent = dist === "ALL" ? "全部區域" : dist;
                btn.addEventListener('click', () => {
                    currentSelectedDistrict = dist;
                    renderDistrictFilters();
                    filterAndRender();
                });
                districtContainer.appendChild(btn);
            });

            // Toggle reset button visibility
            if (currentSelectedDistrict !== "ALL" || currentSearchQuery !== "") {
                resetFilterBtn.classList.remove('hidden');
            } else {
                resetFilterBtn.classList.add('hidden');
            }
        }

        function filterAndRender() {
            markersGroup.clearLayers();
            markerMap.clear();

            // Filter logic
            const filtered = restaurants.filter(item => {
                const matchDistrict = currentSelectedDistrict === "ALL" || item.district === currentSelectedDistrict;
                const matchQuery = currentSearchQuery === "" || 
                    item.name.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                    item.address.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                    item.review.toLowerCase().includes(currentSearchQuery.toLowerCase());
                return matchDistrict && matchQuery;
            });

            // Update Counter
            restaurantCountEl.textContent = `共 ${filtered.length} 家`;

            // Render Cards List
            restaurantList.innerHTML = '';

            if (filtered.length === 0) {
                restaurantList.innerHTML = `
                    <div class="text-center py-12 px-4">
                        <i class="fa-solid fa-utensils text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 font-medium text-sm">沒有找到符合條件的義大利餐廳</p>
                        <p class="text-xs text-slate-400 mt-1">請嘗試變更搜尋關鍵字或選擇其他區域</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                // 1. Create Card Element
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = `p-4 bg-white rounded-xl border border-slate-200 hover:border-italy-red/50 hover:shadow-md transition duration-200 cursor-pointer relative group`;
                
                // Edge Case: Handle No Phone Number
                const hasPhone = item.phone && item.phone !== "無提供電話";
                const phoneButton = hasPhone 
                    ? `<a href="tel:${item.phone}" onclick="event.stopPropagation()" class="flex-1 inline-flex items-center justify-center gap-1.5 py-1.5 px-3 bg-slate-100 hover:bg-italy-green hover:text-white text-slate-700 text-xs font-medium rounded-lg transition">
                        <i class="fa-solid fa-phone text-[11px]"></i> 撥打電話
                       </a>`
                    : `<button disabled class="flex-1 inline-flex items-center justify-center gap-1.5 py-1.5 px-3 bg-slate-100 text-slate-400 text-xs font-medium rounded-lg cursor-not-allowed opacity-60">
                        <i class="fa-solid fa-phone-slash text-[11px]"></i> 無提供電話
                       </button>`;

                // Google Map Navigation URL
                const navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + item.address)}`;

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1.5">
                        <h3 class="font-bold text-slate-900 text-base group-hover:text-italy-red transition">${item.name}</h3>
                        <span class="text-[11px] font-semibold text-italy-green bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200 shrink-0">
                            ${item.district}
                        </span>
                    </div>

                    <p class="text-xs text-slate-500 mb-2 flex items-start gap-1">
                        <i class="fa-solid fa-location-dot text-slate-400 mt-0.5 shrink-0"></i>
                        <span>${item.address}</span>
                    </p>

                    <div class="bg-amber-50/60 border border-amber-100 rounded-lg p-2.5 mb-3">
                        <p class="text-xs text-amber-900/90 leading-relaxed italic">
                            "${item.review}"
                        </p>
                    </div>

                    <div class="flex items-center gap-2 pt-1 border-t border-slate-100">
                        ${phoneButton}
                        <a href="${navUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="flex-1 inline-flex items-center justify-center gap-1.5 py-1.5 px-3 bg-slate-100 hover:bg-italy-red hover:text-white text-slate-700 text-xs font-medium rounded-lg transition">
                            <i class="fa-solid fa-diamond-turn-right text-[11px]"></i> 導航路線
                        </a>
                    </div>
                `;

                // Card Click Event -> Fly to Marker
                card.addEventListener('click', () => {
                    selectRestaurant(item.id, true);
                });

                restaurantList.appendChild(card);

                // 2. Create Map Marker
                const marker = L.marker([item.lat, item.lng], {
                    icon: createCustomIcon(false)
                });

                // Popup content
                const popupContent = `
                    <div class="space-y-2 min-w-[200px]">
                        <div class="flex items-center justify-between border-b pb-1">
                            <span class="font-bold text-slate-900 text-sm">${item.name}</span>
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${item.district}</span>
                        </div>
                        <p class="text-xs text-slate-600"><i class="fa-solid fa-location-dot text-italy-red mr-1"></i>${item.address}</p>
                        <p class="text-xs text-slate-500 italic bg-slate-50 p-1.5 rounded">${item.review}</p>
                        <div class="pt-1 flex gap-1.5">
                            <a href="${navUrl}" target="_blank" class="flex-1 text-center py-1 bg-italy-red text-white text-[11px] rounded font-medium block hover:bg-italy-darkRed transition">
                                <i class="fa-solid fa-location-arrow"></i> 導航
                            </a>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);

                // Marker Click Event
                marker.on('click', () => {
                    selectRestaurant(item.id, false);
                });

                markersGroup.addLayer(marker);
                markerMap.set(item.id, marker);
            });

            // Auto fit bounds if filtered list is not empty
            if (filtered.length > 0) {
                const groupBounds = L.featureGroup(Array.from(markerMap.values())).getBounds();
                map.fitBounds(groupBounds, { padding: [40, 40], maxZoom: 15 });
            }
        }

        function selectRestaurant(id, shouldFly = true) {
            const item = restaurants.find(r => r.id === id);
            if (!item) return;

            // Reset previously active card styling
            if (activeCardId !== null) {
                const prevCard = document.getElementById(`card-${activeCardId}`);
                if (prevCard) prevCard.classList.remove('card-active');
                
                const prevMarker = markerMap.get(activeCardId);
                if (prevMarker) prevMarker.setIcon(createCustomIcon(false));
            }

            activeCardId = id;

            // Highlight current card
            const currentCard = document.getElementById(`card-${id}`);
            if (currentCard) {
                currentCard.classList.add('card-active');
                currentCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Highlight & Open Popup on Map
            const currentMarker = markerMap.get(id);
            if (currentMarker) {
                currentMarker.setIcon(createCustomIcon(true));
                currentMarker.openPopup();

                if (shouldFly) {
                    map.flyTo([item.lat, item.lng], 16, {
                        animate: true,
                        duration: 1
                    });
                }
            }
        }

        // Search Input Event
        searchInput.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value.trim();
            clearSearchBtn.classList.toggle('hidden', currentSearchQuery === '');
            filterAndRender();
        });

        // Clear Search
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentSearchQuery = '';
            clearSearchBtn.classList.add('hidden');
            filterAndRender();
        });

        // Reset Filter Button
        resetFilterBtn.addEventListener('click', () => {
            currentSelectedDistrict = "ALL";
            currentSearchQuery = "";
            searchInput.value = "";
            clearSearchBtn.classList.add('hidden');
            renderDistrictFilters();
            filterAndRender();
            map.flyTo(KAOHSIUNG_CENTER, DEFAULT_ZOOM);
        });

        // Recenter Map Button
        recenterMapBtn.addEventListener('click', () => {
            if (markerMap.size > 0) {
                const groupBounds = L.featureGroup(Array.from(markerMap.values())).getBounds();
                map.fitBounds(groupBounds, { padding: [40, 40], maxZoom: 15 });
            } else {
                map.flyTo(KAOHSIUNG_CENTER, DEFAULT_ZOOM);
            }
        });

        window.onload = function() {
            initMap();
            renderDistrictFilters();
            filterAndRender();
        };
    </script>
</body>
</html>
